name: Brain deterministic tool parity
on:
  push:
    branches: [feature/deterministic-brain-tooling]
    paths:
      - "skills/experimental_v4/**"
      - ".github/workflows/brain-deterministic-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python
        run: python -m compileall -q skills/experimental_v4/brain-init/scripts skills/experimental_v4/tests
      - name: Existing static contracts
        run: python -m unittest discover -s skills/experimental_v4/tests -p 'test_*_contract.py' -v
      - name: Validate existing feature fixture
        run: python skills/experimental_v4/brain-init/scripts/validate_feature_docs.py skills/experimental_v4/tests/fixture/hierarchical-brain/.brain/features --check-coverage
